<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pasatiempos y Juegos</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #000000;
      color: #e8e8f0;
      font-family: 'Nunito', sans-serif;
    }

    /* Capas del fondo, de abajo a arriba:
       0 estrellas · 1 nubes · 2 relámpagos · 3 letras e iconos */
    canvas#stars, canvas#clouds, canvas#bolt {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
    canvas#stars  { z-index: 0; }
    canvas#clouds { z-index: 1; }
    canvas#bolt   { z-index: 2; }

    .page {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 40px;
      gap: 0;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.3rem, min(3.5vw, 5.5vh), 2.6rem);
      color: #fff;
      letter-spacing: 0.03em;
      margin-bottom: clamp(4px, 1vh, 16px);
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.65);
    }
    h1 span { color: #a78bfa; }

    .list {
      display: flex;
      flex-direction: column;
      gap: clamp(0px, 0.3vh, 10px);
      width: 100%;
      max-width: 560px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: clamp(10px, 2vw, 22px);
      text-decoration: none;
      color: #e8e8f0;
      padding: clamp(2px, 0.4vh, 10px) clamp(10px, 2vw, 20px);
      border-radius: 14px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .item:hover {
      background: rgba(255,255,255,0.04);
      border-color: var(--c, #a78bfa);
      transform: translateX(6px);
    }

    .icon {
      width: clamp(24px, min(5vw, 4.2vh), 52px);
      height: clamp(24px, min(5vw, 4.2vh), 52px);
      flex-shrink: 0;
      filter: drop-shadow(0 0 6px var(--c, #a78bfa));
    }

    .name {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(0.8rem, min(2vw, 2.3vh), 1.25rem);
      letter-spacing: 0.01em;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.7);
    }

    .arrow {
      margin-left: auto;
      font-size: clamp(0.75rem, 1.2vw, 0.9rem);
      color: var(--c, #a78bfa);
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
    }
    .item:hover .arrow { opacity: 1; transform: translateX(4px); }

    #soundBtn {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      right: 16px;
      z-index: 10;
      background: rgba(8,13,26,0.55);
      border: 1px solid rgba(125,211,252,0.2);
      border-radius: 50%;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #soundBtn:hover { border-color: rgba(125,211,252,0.5); background: rgba(8,13,26,0.8); }

    /* Ajustes solo para móviles (iPhone/Android) para que la lista completa
       quepa en la pantalla sin salirse; el diseño de escritorio no se toca. */
    @media (max-width: 600px) {
      .page { padding: 4px 16px; }
      .item {
        padding: clamp(1px, 0.3vh, 4px) clamp(8px, 3vw, 14px);
        gap: clamp(8px, 3vw, 14px);
      }
      .icon {
        width: clamp(24px, min(8vw, 4.2vh), 38px);
        height: clamp(24px, min(8vw, 4.2vh), 38px);
      }
      .name { font-size: clamp(0.8rem, min(3.2vw, 2.3vh), 1.05rem); }
    }
  </style>

  <link rel="apple-touch-icon" href="/icons/icon-apple-180.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#000000"/>
</head>

<!-- ═══════════ CAPA 1: NUBES (WebGL, fondo transparente) ═══════════ -->
<script>
(() => {
  const CONFIG = {
    libre: 59, colgar: 2.5, tam: 1.75, estirado: 2.55, turbulencia: 1,
    detalle: 5, borde: 1.2, opacidad: 1, sombra: 0.5, sol: 235,
    viento: 2, evol: 0.55, luz: 1.35, semilla: 0
  };
  const P = CONFIG;
  const canvas = document.getElementById('clouds');

  const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
  if (!gl) { console.error('Nubes: este navegador no admite WebGL.'); return; }

  const VS = 'attribute vec2 a_pos; void main(){ gl_Position = vec4(a_pos, 0., 1.); }';
  const PRECISION = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
`;

  const CAMPO = PRECISION + `
uniform vec2 u_res;
uniform float u_scale, u_aspect, u_est, u_warp, u_oct, u_time, u_wind;
uniform vec2 u_seed;

vec2 hash22(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}
float gnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*f*(f*(f*6.-15.)+10.);
  vec2 g00 = hash22(i) * 2. - 1.;
  vec2 g10 = hash22(i + vec2(1.,0.)) * 2. - 1.;
  vec2 g01 = hash22(i + vec2(0.,1.)) * 2. - 1.;
  vec2 g11 = hash22(i + vec2(1.,1.)) * 2. - 1.;
  float n00 = dot(g00, f);
  float n10 = dot(g10, f - vec2(1.,0.));
  float n01 = dot(g01, f - vec2(0.,1.));
  float n11 = dot(g11, f - vec2(1.,1.));
  return mix(mix(n00, n10, u.x), mix(n01, n11, u.x), u.y);
}
const mat2 ROT = mat2(0.8776, 0.4794, -0.4794, 0.8776);
float fbm(vec2 p, float oct, float churn){
  float s = 0., a = .5;
  for (int i = 0; i < 9; i++) {
    if (float(i) >= oct) break;
    s += a * gnoise(p);
    p = ROT * p * 2.02 + vec2(17.3, 9.1) + vec2(.04, -.025) * churn * float(i + 1);
    a *= .5;
  }
  return s;
}
float field(vec2 uv){
  vec2 p = vec2(uv.x * u_aspect / u_est, uv.y) * u_scale + u_seed - vec2(u_wind, 0.);
  vec2 w = p;
  if (u_warp > 0.) {
    w += u_warp * vec2(
      fbm(p * .7 + vec2(3.1, 7.7) + vec2(0., u_time * .08), 4., u_time),
      fbm(p * .7 + vec2(11.9, 2.3) + vec2(u_time * .06, 0.), 4., u_time));
  }
  return fbm(w, u_oct, u_time);
}
`;

  const FS_CAL = CAMPO + `
void main(){
  vec2 uv = vec2(gl_FragCoord.x / u_res.x, 1. - gl_FragCoord.y / u_res.y);
  float g = field(uv);
  float v = clamp((g + 1.5) / 3., 0., 1.) * 255.;
  gl_FragColor = vec4(floor(v) / 255., fract(v), 0., 1.);
}
`;

  const FS_DENS = CAMPO + `
uniform float u_t, u_w, u_bias, u_t0;
void main(){
  vec2 uv = vec2(gl_FragCoord.x / u_res.x, 1. - gl_FragCoord.y / u_res.y);
  float raw = field(uv);
  // Perfil vertical: arriba (+1) casi siempre nubes, abajo (-1) casi nunca
  float prof = 1. - 2. * smoothstep(.02, .85, uv.y);
  float f = raw + u_bias * prof;
  float d = smoothstep(0., 1., clamp((f - (u_t - u_w)) / (2. * u_w), 0., 1.));
  // Grosor: finos en los bordes, y con relieve fractal también en la zona cubierta
  float g1 = clamp((f - u_t) / (2.2 * u_w), 0., 1.);
  float g2 = clamp((raw - u_t0) / (3. * u_w) + .5, 0., 1.);
  gl_FragColor = vec4(d, g1 * (.3 + .7 * g2), 0., 1.);
}
`;

  // Iluminación nocturna + destello del relámpago (u_fl = x, y, intensidad)
  const FS_LUZ = PRECISION + `
uniform sampler2D u_dens;
uniform vec2 u_res;
uniform vec2 u_sun;
uniform vec3 u_fl;
uniform float u_step, u_shadow, u_opacity, u_gain;
void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  vec4 c = texture2D(u_dens, uv);
  float d = c.r, thick = c.g;
  if (d <= .002) { gl_FragColor = vec4(0.); return; }
  vec2 dir = vec2(u_sun.x, -u_sun.y) * u_step / u_res;
  float occ = 0., wsum = 0.;
  for (int s = 1; s <= 7; s++) {
    float fs = float(s);
    float wgt = 1. - (fs - 1.) / 8.;
    occ += texture2D(u_dens, clamp(uv + dir * fs, 0., 1.)).r * wgt;
    wsum += wgt;
  }
  occ /= wsum;
  float sh = clamp(occ * .8 - .1 + thick * .25, 0., 1.);
  sh = sh * sh * (3. - 2. * sh);
  sh = clamp(sh * u_shadow, 0., 1.);
  vec3 col = mix(vec3(92., 108., 150.), vec3(16., 24., 50.), sh) * u_gain / 255.;
  float brillo = (1. - thick) * (1. - sh) * .25;
  col = min(col + vec3(brillo * 70., brillo * 78., brillo * 100.) * u_gain / 255., 1.);
  vec2 dd = (uv - u_fl.xy) * vec2(u_res.x / u_res.y, 1.);
  float fo = .3 + .7 * exp(-dot(dd, dd) * 3.);
  col = min(col + vec3(.55, .72, 1.) * u_fl.z * fo * (1. - .6 * sh), 1.);
  float a = u_opacity * pow(d, 1.4) * (.5 + .5 * thick);
  gl_FragColor = vec4(col * a, a);
}
`;

  function compilar(tipo, src) {
    const s = gl.createShader(tipo);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function programa(fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compilar(gl.VERTEX_SHADER, VS));
    gl.attachShader(p, compilar(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'a_pos');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const nu = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < nu; i++) {
      const inf = gl.getActiveUniform(p, i);
      u[inf.name] = gl.getUniformLocation(p, inf.name);
    }
    return { p, u };
  }

  let progCal, progDens, progLuz;
  try {
    progCal = programa(FS_CAL);
    progDens = programa(FS_DENS);
    progLuz = programa(FS_LUZ);
  } catch (e) {
    console.error('Nubes: no se pudo iniciar WebGL.', e);
    return;
  }

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.disable(gl.BLEND);

  function crearFBO(w, h, filtro) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filtro);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filtro);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex, fb, w, h };
  }
  function borrarFBO(f) {
    if (!f) return;
    gl.deleteTexture(f.tex); gl.deleteFramebuffer(f.fb);
  }

  const MAX_PIXELS = 600000;
  let calidad = 1;
  let dens = null, cal = null, bufCal = null;
  let dw = 2, dh = 2, aspecto = 1;
  let semilla = 0, seedX = 0, seedY = 0;
  let tiempo = 0, viento = 0;
  let pausado = false, sucio = true, snapPend = true;
  let iqrS = null, tS = 0, sesgoA = 0, t0S = 0;
  function perfil(v) {
    const x = Math.min(1, Math.max(0, (v - 0.02) / 0.83));
    return 1 - 2 * (x * x * (3 - 2 * x));
  }

  function aleatoria() { return (Math.random() * 4294967295 + 1) >>> 0; }

  function fijarSemilla() {
    const r = (function (a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    })(semilla);
    seedX = r() * 200; seedY = r() * 200;
  }

  function redimensionar() {
    const Wd = window.innerWidth, Hd = window.innerHeight;
    const k = Math.min(1, Math.sqrt(MAX_PIXELS / (Wd * Hd))) * calidad;
    dw = Math.max(2, Math.round(Wd * k));
    dh = Math.max(2, Math.round(Hd * k));
    aspecto = Wd / Hd;
    canvas.width = dw; canvas.height = dh;

    borrarFBO(dens); borrarFBO(cal);
    dens = crearFBO(dw, dh, gl.LINEAR);
    const cw = 160;
    const ch = Math.max(24, Math.min(160, Math.round(cw * Hd / Wd)));
    cal = crearFBO(cw, ch, gl.NEAREST);
    bufCal = new Uint8Array(cw * ch * 4);
    snapPend = true; sucio = true;
  }

  function uniformesCampo(pr, w, h) {
    gl.useProgram(pr.p);
    gl.uniform2f(pr.u.u_res, w, h);
    gl.uniform1f(pr.u.u_scale, 2.4 / P.tam);
    gl.uniform1f(pr.u.u_aspect, aspecto);
    gl.uniform1f(pr.u.u_est, P.estirado);
    gl.uniform1f(pr.u.u_warp, P.turbulencia);
    gl.uniform1f(pr.u.u_oct, P.detalle);
    gl.uniform1f(pr.u.u_time, tiempo);
    gl.uniform1f(pr.u.u_wind, viento);
    gl.uniform2f(pr.u.u_seed, seedX, seedY);
  }

  function calibrar(snap) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, cal.fb);
    gl.viewport(0, 0, cal.w, cal.h);
    uniformesCampo(progCal, cal.w, cal.h);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.readPixels(0, 0, cal.w, cal.h, gl.RGBA, gl.UNSIGNED_BYTE, bufCal);

    const N = cal.w * cal.h;
    const g = new Float32Array(N);
    const vtop = new Float32Array(N);
    for (let r = 0; r < cal.h; r++) {
      const vt = 1 - (r + 0.5) / cal.h;
      for (let c = 0; c < cal.w; c++) {
        const i = r * cal.w + c, j = i * 4;
        const v = bufCal[j] / 255 + bufCal[j + 1] / 255 / 255;
        g[i] = v * 3 - 1.5;
        vtop[i] = vt;
      }
    }

    const s1 = Float32Array.from(g).sort();
    const iqr = Math.max(1e-4, s1[Math.floor(N * 0.75)] - s1[Math.floor(N * 0.25)]);
    iqrS = (iqrS === null || snap) ? iqr : iqrS + (iqr - iqrS) * 0.2;
    sesgoA = P.colgar * iqrS * 0.85;
    const med = s1[N >> 1];
    t0S = (snap || t0S === 0) ? med : t0S + (med - t0S) * 0.2;

    const fp = new Float32Array(N);
    for (let i = 0; i < N; i++) fp[i] = g[i] + sesgoA * perfil(vtop[i]);
    const s2 = Float32Array.from(fp).sort();
    const idx = Math.min(N - 1, Math.max(0, Math.floor(N * P.libre / 100)));
    const tObj = s2[idx];
    tS = snap ? tObj : tS + (tObj - tS) * 0.25;
  }

  function dibujar() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, dens.fb);
    gl.viewport(0, 0, dw, dh);
    uniformesCampo(progDens, dw, dh);
    gl.uniform1f(progDens.u.u_t, tS);
    gl.uniform1f(progDens.u.u_w, Math.max(1e-4, iqrS * P.borde));
    gl.uniform1f(progDens.u.u_bias, sesgoA);
    gl.uniform1f(progDens.u.u_t0, t0S);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, dw, dh);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(progLuz.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, dens.tex);
    gl.uniform1i(progLuz.u.u_dens, 0);
    gl.uniform2f(progLuz.u.u_res, dw, dh);
    const ang = P.sol * Math.PI / 180;
    gl.uniform2f(progLuz.u.u_sun, Math.cos(ang), Math.sin(ang));
    gl.uniform1f(progLuz.u.u_step, Math.max(2, dh / 110));
    gl.uniform1f(progLuz.u.u_shadow, P.sombra);
    gl.uniform1f(progLuz.u.u_opacity, P.opacidad);
    gl.uniform1f(progLuz.u.u_gain, P.luz);
    const F = window.NubesNoche.destello;
    gl.uniform3f(progLuz.u.u_fl, F.x, F.y, F.i);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  let last = performance.now(), frameN = 0, acum = 0, cnt = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dtReal = (now - last) / 1000;
    last = now;
    const dt = Math.min(0.1, dtReal);

    if (!pausado) {
      tiempo += dt * P.evol;
      viento += dt * P.viento * 0.03;
    } else if (!sucio) {
      return;
    }

    if (snapPend) { calibrar(true); snapPend = false; frameN = 0; }
    else if (!pausado && ++frameN % 6 === 0) calibrar(false);

    dibujar();
    sucio = false;

    // Calidad adaptativa: si va lento, baja la resolución interna
    if (!pausado && dtReal < 0.1) {
      acum += dtReal;
      if (++cnt >= 45) {
        const media = acum / cnt;
        acum = 0; cnt = 0;
        if (media > 0.036 && calidad > 0.4) { calidad *= 0.8; redimensionar(); }
      }
    }
  }

  window.NubesNoche = {
    config: P,
    destello: { x: 0.5, y: 0.75, i: 0 },   // lo actualizan los relámpagos
    set(cambios) {
      Object.assign(P, cambios || {});
      if ('semilla' in (cambios || {})) {
        semilla = P.semilla > 0 ? P.semilla : aleatoria();
        fijarSemilla();
      }
      snapPend = true; sucio = true;
    },
    nuevoCielo() { semilla = aleatoria(); fijarSemilla(); snapPend = true; sucio = true; },
    pausar() { pausado = true; },
    seguir() { if (pausado) { pausado = false; last = performance.now(); } }
  };

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(redimensionar, 250); });

  semilla = P.semilla > 0 ? P.semilla : aleatoria();
  fijarSemilla();
  redimensionar();
  requestAnimationFrame(frame);
})();
</script>

<!-- ═══════════ CAPA 0: ESTRELLAS · CAPA 2: RELÁMPAGOS ═══════════ -->
<script>
(function(){
  const starCanvas = document.getElementById('stars');
  const sctx       = starCanvas.getContext('2d');
  const canvas     = document.getElementById('bolt');
  const ctx        = canvas.getContext('2d');

  const DEPTH  = 9;
  const BRANCH = 0.50;
  const TURB   = 240;
  const FADE   = 1.25;

  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let W, H, stars = [];

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    for(const [c, x] of [[starCanvas, sctx], [canvas, ctx]]){
      c.width  = W * dpr;
      c.height = H * dpr;
      c.style.width  = W + 'px';
      c.style.height = H + 'px';
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    generateStars();
  }

  function generateStars(){
    stars = [];
    const count = Math.floor((W * H) / 9000);
    for(let i = 0; i < count; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.8,
        r: Math.random() * 1.3 + 0.3,
        speed: Math.random() * 0.3 + 0.05,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  // Capa 0: cielo y estrellas titilantes
  function drawBackground(){
    const g = sctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,   '#05070f');
    g.addColorStop(0.6, '#0b1226');
    g.addColorStop(1,   '#141b33');
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, W, H);

    sctx.fillStyle = '#cdd9f5';
    const t = performance.now() / 1000;
    for(const s of stars){
      sctx.globalAlpha = 0.15 + Math.abs(Math.sin(s.phase + t * s.speed)) * 0.65;
      sctx.beginPath();
      sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.globalAlpha = 1;
  }
  function starLoop(){
    drawBackground();
    requestAnimationFrame(starLoop);
  }

  function generateBolt(originX, targetX){
    const segments = [];
    function recurse(x1,y1,x2,y2,d,disp,isBranch,level){
      if(d<=0){ segments.push({x1,y1,x2,y2,isBranch,level}); return; }
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
      const off=(Math.random()-0.5)*disp;
      let nx=0,ny=0;
      if(len>0){ nx=-dy/len; ny=dx/len; }
      const px=mx+nx*off, py=my+ny*off;
      recurse(x1,y1,px,py, d-1,disp*0.55,isBranch,level+1);
      recurse(px,py,x2,y2, d-1,disp*0.55,isBranch,level+1);
      if(!isBranch && d>1 && Math.random()<BRANCH){
        const ang=Math.atan2(y2-y1,x2-x1)+(Math.random()-0.5)*1.6;
        const blen=len*(0.25+Math.random()*0.35);
        recurse(px,py, px+Math.cos(ang)*blen, py+Math.sin(ang)*blen,
                Math.min(d-1,4), disp*0.5, true, 0);
      }
    }
    recurse(originX,-20,targetX,H+20, DEPTH,TURB,false,0);
    return segments;
  }

  function drawBolt(segments,alpha){
    if(!segments||alpha<=0) return;
    ctx.globalAlpha=alpha;
    const thick=[],med=[],thin=[],branch=[];
    for(const s of segments){
      if(s.isBranch) branch.push(s);
      else if(s.level<=2) thick.push(s);
      else if(s.level<=4) med.push(s);
      else thin.push(s);
    }
    function group(list,glowW,coreW,glowColor,coreColor){
      if(!list.length) return;
      ctx.lineCap='round';
      ctx.beginPath();
      for(const s of list){ ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); }
      ctx.strokeStyle=glowColor; ctx.lineWidth=glowW; ctx.stroke();
      ctx.beginPath();
      for(const s of list){ ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); }
      ctx.strokeStyle=coreColor; ctx.lineWidth=coreW; ctx.stroke();
    }
    ctx.shadowBlur=0;
    group(thick,16,4,   `rgba(125,211,252,${alpha*0.55})`,`rgba(255,255,255,${alpha})`);
    group(med,  10,2.4, `rgba(125,211,252,${alpha*0.45})`,`rgba(255,255,255,${alpha})`);
    group(thin,  6,1.3, `rgba(125,211,252,${alpha*0.40})`,`rgba(245,251,255,${alpha})`);
    group(branch,7,1.6, `rgba(196,165,250,${alpha*0.45})`,`rgba(233,216,255,${alpha})`);
  }

  function drawGroundGlow(alpha,x){
    if(alpha<=0) return;
    const grad=ctx.createRadialGradient(x,H,0,x,H,H*0.55);
    grad.addColorStop(0,`rgba(150,200,255,${alpha*0.25})`);
    grad.addColorStop(1,'rgba(150,200,255,0)');
    ctx.fillStyle=grad;
    ctx.fillRect(0,H*0.4,W,H*0.6);
  }

  // Capa 2: relámpagos (por encima de las nubes, por debajo del texto)
  let bolt=null, boltAlpha=0, flashAlpha=0, strikeX=0;
  let lastTime=0, rafId=null;

  function drawBoltScene(){
    ctx.clearRect(0,0,W,H);
    ctx.globalAlpha=1;
    drawGroundGlow(boltAlpha,strikeX);
    drawBolt(bolt,boltAlpha);
    ctx.globalAlpha=1;
    if(flashAlpha>0){
      const g=ctx.createRadialGradient(strikeX,H*0.2,0,strikeX,H*0.2,Math.max(W,H));
      g.addColorStop(0,`rgba(190,215,255,${flashAlpha*0.28})`);
      g.addColorStop(1,'rgba(190,215,255,0)');
      ctx.fillStyle=g;
      ctx.fillRect(0,0,W,H);
    }
    // El destello también ilumina las nubes desde dentro (shader)
    const d=window.NubesNoche && window.NubesNoche.destello;
    if(d){ d.x=strikeX/W; d.y=0.78; d.i=flashAlpha; }
  }

  function boltLoop(t){
    const dt=lastTime?(t-lastTime)/1000:0;
    lastTime=t;
    if(boltAlpha>0)  boltAlpha =Math.max(0,boltAlpha -dt/FADE);
    if(flashAlpha>0) flashAlpha=Math.max(0,flashAlpha-dt/0.2);
    drawBoltScene();
    if(boltAlpha>0||flashAlpha>0){
      rafId=requestAnimationFrame(boltLoop);
    } else {
      bolt=null; lastTime=0; rafId=null;
      ctx.clearRect(0,0,W,H);
    }
  }

  let audioCtx = null;
  let soundOn  = false;
  const btn    = document.getElementById('soundBtn');

  function getAC(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playThunder(distanceFactor){
    if(!soundOn) return;
    const ac = getAC();
    if(!ac) return;

    const dist     = Math.max(0, Math.min(1, distanceFactor));
    const delay    = 0.08 + dist * 1.4;
    const duration = 2.5 + Math.random()*2.5 + dist*2.5;
    const peak     = 0.72 - dist*0.28;
    const cutoff   = 220 - dist*100;

    const sampleRate = ac.sampleRate;
    const bufLen     = Math.ceil(sampleRate * duration);
    const buffer     = ac.createBuffer(1, bufLen, sampleRate);
    const data       = buffer.getChannelData(0);

    let last = 0;
    for(let i = 0; i < 2000; i++){ last = (last + 0.02*(Math.random()*2-1)) / 1.02; }

    for(let i = 0; i < bufLen; i++){
      const w = Math.random()*2 - 1;
      data[i] = (last + 0.02*w) / 1.02;
      last = data[i];
    }
    let noisePeak = 0;
    for(let i = 0; i < bufLen; i++){
      if(Math.abs(data[i]) > noisePeak) noisePeak = Math.abs(data[i]);
    }
    const scale = (noisePeak > 0) ? (0.85 / noisePeak) : 1;
    const fadeLen = Math.floor(sampleRate * 0.015);
    for(let i = 0; i < bufLen; i++){
      let env = 1;
      if(i < fadeLen) env = i / fadeLen;
      else if(i > bufLen - fadeLen) env = (bufLen - i) / fadeLen;
      const s = data[i] * scale * env;
      data[i] = Math.tanh(s * 2) * 0.5;
    }

    const src = ac.createBufferSource();
    src.buffer = buffer;

    const lpf = ac.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = cutoff;
    lpf.Q.value = 0.6;

    const lpf2 = ac.createBiquadFilter();
    lpf2.type = 'lowpass';
    lpf2.frequency.value = cutoff * 1.8;

    const gain = ac.createGain();
    const now  = ac.currentTime + delay;

    gain.gain.setValueAtTime(0,           now);
    gain.gain.linearRampToValueAtTime(peak,           now + 0.15);
    gain.gain.exponentialRampToValueAtTime(peak*0.45, now + 0.55);
    gain.gain.exponentialRampToValueAtTime(peak*0.18, now + 1.8);
    gain.gain.exponentialRampToValueAtTime(0.0001,    now + duration*0.9);
    gain.gain.linearRampToValueAtTime(0,              now + duration);

    if(!ac._compressor){
      ac._compressor = ac.createDynamicsCompressor();
      ac._compressor.threshold.value = -6;
      ac._compressor.knee.value      = 10;
      ac._compressor.ratio.value     = 8;
      ac._compressor.attack.value    = 0.003;
      ac._compressor.release.value   = 0.25;
      ac._compressor.connect(ac.destination);
    }

    src.connect(lpf);
    lpf.connect(lpf2);
    lpf2.connect(gain);
    gain.connect(ac._compressor);

    src.start(now);
    src.stop(now + duration + 0.2);
  }

  btn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    btn.textContent = soundOn ? '🔊' : '🔇';
    if(soundOn) getAC();
  });

  function strike(){
    const x       = Math.random()*W;
    const originX = Math.max(0,Math.min(W, x+(Math.random()*160-80)));
    const targetX = Math.max(0,Math.min(W, x+(Math.random()*80 -40)));
    strikeX = targetX;
    bolt      = generateBolt(originX, targetX);
    boltAlpha = 1; flashAlpha = 1; lastTime = 0;

    const dist = Math.abs(x - W/2) / (W/2) * 0.7 + Math.random()*0.3;
    playThunder(dist);

    // Segundo destello más tenue, como en un relámpago real
    setTimeout(()=>{ flashAlpha = Math.max(flashAlpha, 0.7); }, 110);

    if(!rafId) rafId=requestAnimationFrame(boltLoop);
    setTimeout(strike, Math.random()*4000);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(starLoop);
  setTimeout(strike, Math.random()*4000);
})();
</script>
